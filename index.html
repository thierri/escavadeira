<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escavadeira Hidráulica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Palco fixo 1920×1080 (16:9), escalado para caber na janela, sem rolagem -->
  <div id="stage">
    <header id="topbar">
      <h1>Escavadeira hidráulica <span>· como funciona</span></h1>
      <div class="group" id="layers">
        <span class="glabel">Mostrar</span>
        <button class="chip on" data-show="hoses">Mangueiras</button>
        <button class="chip on" data-show="pilot">Piloto</button>
        <button class="chip on" data-show="labels">Nomes</button>
        <button class="chip on" data-show="values">Valores</button>
      </div>
      <div class="group" id="sound">
        <button class="chip icon" id="btn-sound" aria-label="Som ligado (clique para silenciar)" title="Som ligado (clique para silenciar)">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
            <g class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/>
            </g>
            <g class="mute" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
            </g>
          </svg>
        </button>
        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
      <div class="group right">
        <button class="chip" id="btn-present">▶ Apresentação</button>
        <button class="chip" id="btn-params">Parâmetros</button>
        <button class="chip" id="btn-reset">Reiniciar</button>
      </div>
    </header>
    <svg id="scene" width="1400" height="784" viewBox="0 0 1400 784"></svg>
    <svg id="overlay" width="1400" height="784" viewBox="0 0 1400 784"></svg>
    <svg id="panel" width="520" height="784" viewBox="0 0 520 784"></svg>
    <div id="drawer"></div>
    <footer id="controls"></footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
